<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>VOID MC TIERS</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --purple:#9b5cff;
  --purple-dark:#6d28d9;
  --red:#ff3b4f;
  --green:#35e88f;
  --bg:#050507;
  --panel:#0d0d12;
  --panel2:#12121a;
  --border:#292432;
  --text:#f5f5f7;
  --muted:#88838f;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 15% 10%,rgba(155,92,255,.13),transparent 30%),
    radial-gradient(circle at 85% 25%,rgba(255,59,79,.08),transparent 28%),
    radial-gradient(circle at 50% 90%,rgba(53,232,143,.07),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

header{
  height:66px;
  background:rgba(7,7,10,.95);
  border-bottom:1px solid #25202d;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  position:sticky;
  top:0;
  z-index:10;
  backdrop-filter:blur(12px);
}

.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:.7px;
}

.logo span{
  color:var(--purple);
}

.admin{
  color:#fff;
  text-decoration:none;
  font-weight:800;
  padding:10px 15px;
  border-radius:9px;
  background:linear-gradient(135deg,#18131f,#111116);
  border:1px solid #362b46;
  transition:.2s;
}

.admin:hover{
  border-color:var(--purple);
  box-shadow:0 0 18px rgba(155,92,255,.25);
}

main{
  max-width:1100px;
  margin:auto;
  padding:42px 20px 70px;
}

.hero{
  text-align:center;
  padding:42px 15px 45px;
}

.hero h1{
  margin:0;
  font-size:clamp(42px,8vw,76px);
  font-weight:950;
  letter-spacing:-3px;
  text-shadow:0 0 25px rgba(155,92,255,.2);
}

.hero h1 span{
  color:var(--purple);
}

.hero p{
  color:#8d8994;
  margin-top:13px;
  font-size:16px;
}

.controls{
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr;
  gap:12px;
  margin-bottom:32px;
}

input,select{
  width:100%;
  background:#0e0e14;
  color:#eee;
  border:1px solid #2b2633;
  border-radius:10px;
  padding:15px;
  font-size:15px;
  outline:none;
  transition:.2s;
}

input:hover,
select:hover{
  border-color:#49365d;
}

input:focus,
select:focus{
  border-color:var(--purple);
  box-shadow:0 0 0 3px rgba(155,92,255,.08);
}

.section-title{
  font-size:26px;
  font-weight:900;
  margin:28px 0 15px;
}

.card{
  background:linear-gradient(145deg,#101016,#0b0b0f);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  box-shadow:
    0 12px 40px rgba(0,0,0,.35),
    inset 0 1px rgba(255,255,255,.02);
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:600px;
}

th{
  background:#121119;
  color:#85808c;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.7px;
  text-align:left;
  padding:16px 15px;
  border-bottom:1px solid #292330;
}

td{
  padding:15px;
  border-top:1px solid #211e26;
}

tbody tr{
  transition:.18s;
}

tbody tr:hover td{
  background:linear-gradient(
    90deg,
    rgba(155,92,255,.07),
    rgba(255,59,79,.025)
  );
}

.position{
  color:#77727e;
  font-weight:800;
  width:55px;
}

.player-name{
  font-weight:900;
}

.points{
  font-weight:900;
  color:var(--green);
}

/* =========================
   PNG ICONS
========================= */

.mode-icons{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.mode-icon-box{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111018;
  border:1px solid #30273b;
  border-radius:9px;
  transition:.18s;
}

.mode-icon-box:hover{
  transform:translateY(-2px) scale(1.06);
  border-color:var(--purple);
  box-shadow:0 0 14px rgba(155,92,255,.25);
}

.mode-icon{
  width:34px;
  height:34px;
  object-fit:contain;
  image-rendering:auto;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.8));
}

.empty{
  padding:35px;
  text-align:center;
  color:#77727e;
}

footer{
  text-align:center;
  color:#66616d;
  padding:25px;
  border-top:1px solid #19161e;
  font-size:13px;
}

@media(max-width:750px){

  .controls{
    grid-template-columns:1fr;
  }

  main{
    padding:25px 12px 50px;
  }

  header{
    padding:0 14px;
  }

  .hero h1{
    font-size:48px;
  }

  .mode-icon-box{
    width:38px;
    height:38px;
  }

  .mode-icon{
    width:30px;
    height:30px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    VOID MC <span>TIERS</span>
  </div>

  <a class="admin" href="admin.html">
    🔐 Admin
  </a>

</header>


<main>

<section class="hero">

  <h1>
    VOID MC <span>TIERS</span>
  </h1>

  <p>
    MCPE Tier Testing • S → D • High / Mid / Low
  </p>

</section>


<!-- FILTERS -->

<div class="controls">

  <input
    id="search"
    type="text"
    placeholder="🔎 Search player..."
  >

  <select id="mode">

    <option value="ALL">Overall</option>

    <option value="AXE PVP">AXE PVP</option>
    <option value="CART PVP">CART PVP</option>
    <option value="DIA KIT">DIA KIT</option>
    <option value="E-MACE">E-MACE</option>
    <option value="NETPOT">NETPOT</option>
    <option value="SMP KIT">SMP KIT</option>
    <option value="SPEAR MACE">SPEAR MACE</option>
    <option value="TANK">TANK</option>
    <option value="UHC">UHC</option>
    <option value="VANILLA CRYSTAL">VANILLA CRYSTAL</option>

  </select>


  <select id="tierFilter">

    <option value="ALL">All Tiers</option>

    <option value="HT1">HT1</option>
    <option value="MT1">MT1</option>
    <option value="LT1">LT1</option>

    <option value="HT2">HT2</option>
    <option value="MT2">MT2</option>
    <option value="LT2">LT2</option>

    <option value="HT3">HT3</option>
    <option value="MT3">MT3</option>
    <option value="LT3">LT3</option>

    <option value="HT4">HT4</option>
    <option value="MT4">MT4</option>
    <option value="LT4">LT4</option>

    <option value="HT5">HT5</option>
    <option value="MT5">MT5</option>
    <option value="LT5">LT5</option>

  </select>

</div>


<!-- LEADERBOARD -->

<div class="section-title">
  📊 Leaderboard
</div>

<div class="card table-wrap">

<table>

<thead>
<tr>
  <th>#</th>
  <th>Player</th>
  <th>Gamemode</th>
  <th>Points</th>
</tr>
</thead>

<tbody id="leaderboard">

<tr>
  <td colspan="4" class="empty">
    Loading...
  </td>
</tr>

</tbody>

</table>

</div>

</main>


<footer>
  VOID MC TIERS • MCPE Tier Testing
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

/* =========================
   FIXED TIER POINTS
========================= */

const TIER_POINTS = {

  HT1:1000,
  MT1:950,
  LT1:900,

  HT2:850,
  MT2:800,
  LT2:750,

  HT3:700,
  MT3:650,
  LT3:600,

  HT4:550,
  MT4:500,
  LT4:450,

  HT5:400,
  MT5:350,
  LT5:300

};


/* =========================
   YOUR PNG ICONS
========================= */

const MODE_ICONS = {

  "VANILLA CRYSTAL":
    ["Icons/vanilla-crystal.png"],

  "UHC":
    ["Icons/uhc.png"],

  "SMP KIT":
    ["Icons/smp-kit.png"],

  "NETPOT":
    ["Icons/nethpot.png"],

  "CART PVP":
    ["Icons/cart-pvp.png"],

  "AXE PVP":
    ["Icons/axe-pvp.png"],

  "DIA KIT":
    ["Icons/dia-kit.png"],

  "TANK":
    ["Icons/tank.png"],

  "E-MACE":
    ["Icons/emace.png"],

  "SPEAR MACE":
    ["Icons/spear-mace.png"]

};


/* =========================
   VARIABLES
========================= */

let players = [];


/* =========================
   SUPABASE
========================= */

const sb = window.supabase.createClient(
  window.VOID_SUPABASE.url,
  window.VOID_SUPABASE.anonKey
);


/* =========================
   LOAD PLAYERS
========================= */

async function loadPlayers(){

  const {data,error} =
    await sb
      .from("players")
      .select("name,mode,tier,points");


  if(error){

    console.error(error);

    document.getElementById("leaderboard").innerHTML =
      `<tr>
        <td colspan="4" class="empty">
          ⚠️ ${escapeHTML(error.message)}
        </td>
      </tr>`;

    return;
  }


  players =
    (data || []).filter(p =>
      p.name &&
      p.mode &&
      TIER_POINTS[p.tier]
    );


  render();

}


/* =========================
   FIXED POINTS
========================= */

function getPoints(player){

  return TIER_POINTS[player.tier] || 0;

}


/* =========================
   CREATE ICON HTML
========================= */

function getModeIcons(mode){

  const icons =
    MODE_ICONS[mode] || [];


  return `
    <div class="mode-icons">

      ${icons.map(src => `

        <div class="mode-icon-box">

          <img
            class="mode-icon"
            src="${src}"
            alt=""
          >

        </div>

      `).join("")}

    </div>
  `;

}


/* =========================
   BUILD OVERALL
========================= */

function buildOverall(){

  const map = new Map();


  players.forEach(player => {

    if(!map.has(player.name)){

      map.set(player.name,{
        name:player.name,
        total:0,
        modes:[]
      });

    }


    const p =
      map.get(player.name);


    const pts =
      getPoints(player);


    p.total += pts;


    p.modes.push({

      mode:player.mode,
      tier:player.tier,
      points:pts

    });

  });


  return [...map.values()]
    .sort((a,b)=>b.total-a.total);

}


/* =========================
   FILTER
========================= */

function getFiltered(){

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const mode =
    document.getElementById("mode").value;


  const tier =
    document.getElementById("tierFilter").value;


  return players.filter(p => {

    const searchOK =
      !search ||
      p.name.toLowerCase().includes(search);


    const modeOK =
      mode === "ALL" ||
      p.mode === mode;


    const tierOK =
      tier === "ALL" ||
      p.tier === tier;


    return searchOK &&
           modeOK &&
           tierOK;

  });

}


/* =========================
   LEADERBOARD
========================= */

function renderLeaderboard(){

  const tbody =
    document.getElementById("leaderboard");


  const mode =
    document.getElementById("mode").value;


  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const tier =
    document.getElementById("tierFilter").value;


  /* OVERALL */

  if(mode === "ALL"){

    const overall =
      buildOverall();


    const filtered =
      overall.filter(p => {

        if(
          search &&
          !p.name.toLowerCase().includes(search)
        ){
          return false;
        }


        if(
          tier !== "ALL" &&
          !p.modes.some(
            x => x.tier === tier
          )
        ){
          return false;
        }


        return true;

      });


    if(!filtered.length){

      tbody.innerHTML =
        `<tr>
          <td colspan="4" class="empty">
            No players found.
          </td>
        </tr>`;

      return;

    }


    tbody.innerHTML =
      filtered.map((p,i)=>{

        const uniqueModes =
          [...new Set(
            p.modes.map(
              x => x.mode
            )
          )];


        const icons =
          uniqueModes
            .map(
              modeName =>
                getModeIcons(modeName)
            )
            .join("");


        return `
          <tr>

            <td class="position">
              ${i+1}
            </td>

            <td class="player-name">
              ${escapeHTML(p.name)}
            </td>

            <td>
              <div class="mode-icons">
                ${icons}
              </div>
            </td>

            <td class="points">
              ${p.total}
            </td>

          </tr>
        `;

      }).join("");


    return;

  }


  /* SINGLE GAMEMODE */

  const list =
    getFiltered()
      .sort(
        (a,b)=>
          getPoints(b)-getPoints(a)
      );


  if(!list.length){

    tbody.innerHTML =
      `<tr>
        <td colspan="4" class="empty">
          No players found.
        </td>
      </tr>`;

    return;

  }


  tbody.innerHTML =
    list.map((p,i)=>{

      return `
        <tr>

          <td class="position">
            ${i+1}
          </td>

          <td class="player-name">
            ${escapeHTML(p.name)}
          </td>

          <td>
            ${getModeIcons(p.mode)}
          </td>

          <td class="points">
            ${getPoints(p)}
          </td>

        </tr>
      `;

    }).join("");

}


/* =========================
   RENDER
========================= */

function render(){

  renderLeaderboard();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================
   CONTROLS
========================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    render
  );


document
  .getElementById("mode")
  .addEventListener(
    "change",
    render
  );


document
  .getElementById("tierFilter")
  .addEventListener(
    "change",
    render
  );


/* =========================
   START
========================= */

loadPlayers();

</script>

</body>
</html>
